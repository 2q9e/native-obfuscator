name: Verify native translation

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  llvm:
    needs: cross-build
    runs-on: ${{ matrix.runner }}
    container: quay.io/fedora/fedora:${{ matrix.fedora }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - fedora: '44'
            llvm: '22'
            runner: ubuntu-24.04
            arch: x86_64
          - fedora: '45'
            llvm: '23'
            runner: ubuntu-24.04
            arch: x86_64
          - fedora: '44'
            llvm: '22'
            runner: ubuntu-24.04-arm
            arch: aarch64
          - fedora: '45'
            llvm: '23'
            runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - name: Install the matching LLVM and C++ toolchain
        env:
          EXPECTED_LLVM: ${{ matrix.llvm }}
        run: |
          dnf install -y clang cmake gcc-c++ git gzip java-25-openjdk-devel llvm llvm-devel llvm-static make python3 tar xz
          printf '/usr/lib64/llvm%s/bin\n' "$EXPECTED_LLVM" >> "$GITHUB_PATH"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-obfuscator-cli
      - name: Build and execute LLVM plugin tests
        shell: bash
        env:
          EXPECTED_LLVM: ${{ matrix.llvm }}
        run: |
          mkdir -p build/llvm-results
          version=$(llvm-config --version)
          test "${version%%.*}" = "$EXPECTED_LLVM"
          printf 'LLVM %s\n' "$version" > build/llvm-results/toolchain.txt
          clang --version >> build/llvm-results/toolchain.txt
          cmake -S llvm -B build/llvm-ci -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR="$(llvm-config --cmakedir)" \
            2>&1 | tee build/llvm-results/configure.log
          cmake --build build/llvm-ci --parallel 2 2>&1 | tee build/llvm-results/build.log
          test "$(ctest --test-dir build/llvm-ci --show-only=json-v1 |
            python3 -c 'import json,sys; print(len(json.load(sys.stdin)["tests"]))')" -ge 7
          ctest --test-dir build/llvm-ci --output-on-failure --no-tests=error \
            --output-junit "$PWD/build/llvm-results/ctest.xml" 2>&1 | tee build/llvm-results/ctest.log
      - name: Verify scoped LLVM builds through the CLI
        shell: bash
        run: |
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          mkdir -p build/install
          tar -xzf native-obfuscator-cli.tar.gz -C build/install
          python3 src/test/native-build/verify.py build/install/native-obfuscator/bin/native-obfuscator \
            --clang "$(command -v clang)" --llvm-opt "$(command -v opt)" \
            --llvm-plugin build/llvm-ci/NativeEncode.so 2>&1 | tee build/llvm-results/scoped-cli.log
      - name: Package the tested LLVM plugin
        shell: bash
        env:
          FEDORA_VERSION: ${{ matrix.fedora }}
          PLUGIN_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$PLUGIN_ARCH"
          mkdir -p build/plugin-package build/plugin-assets
          cp build/llvm-ci/NativeEncode.so llvm/README.md LICENSE build/plugin-package/
          llvm_version=$(llvm-config --version)
          rpm -q llvm llvm-libs clang > build/plugin-package/toolchain.txt
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C build/plugin-package -cf - . |
            gzip -n > "build/plugin-assets/native-encode-linux-$PLUGIN_ARCH-llvm-$llvm_version-fedora$FEDORA_VERSION.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llvm-plugin-linux-${{ matrix.arch }}-${{ matrix.llvm }}
          path: build/plugin-assets/*.tar.gz
          if-no-files-found: error
          retention-days: 3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: matrix.arch == 'x86_64'
        with:
          name: zig-linux-x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: matrix.arch == 'x86_64'
        with:
          name: cross-built-fixture
          path: fixture
      - name: Build the LLVM differential JAR for all four targets
        if: matrix.arch == 'x86_64'
        shell: bash
        env:
          LLVM_MAJOR: ${{ matrix.llvm }}
        run: |
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          tar -xJf zig-x86_64-linux-0.15.2.tar.xz
          build/install/native-obfuscator/bin/native-obfuscator protect \
            --input fixture/original.jar --output "fixture/llvm-$LLVM_MAJOR-maximum.jar" --include 'Arithmetic#calc*' \
            --unsupported retain --target all --zig "$PWD/zig-x86_64-linux-0.15.2/zig" \
            --clang "$(command -v clang)" --llvm-opt "$(command -v opt)" \
            --llvm-plugin build/llvm-ci/NativeEncode.so --profile maximum --seed 42 \
            2>&1 | tee build/llvm-results/cross-build.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.arch == 'x86_64'
        with:
          name: llvm-differential-fixture-${{ matrix.llvm }}
          path: fixture/llvm-${{ matrix.llvm }}-maximum.jar
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: llvm-results-${{ matrix.arch }}-${{ matrix.llvm }}
          path: |
            build/llvm-results
            build/llvm-ci/Testing/Temporary/LastTest*.log
          if-no-files-found: error
          retention-days: 14

  differential:
    needs: cross-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-obfuscator-cli
      - run: mkdir -p build/install && tar -xzf native-obfuscator-cli.tar.gz -C build/install
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: '9.3.1'
      - run: bash src/test/integration.sh "$PWD/build/install/native-obfuscator/bin/native-obfuscator"
        env:
          JAVA_RELEASE: ${{ matrix.java }}
      - run: bash src/test/class-paths/verify.sh "$PWD/build/install/native-obfuscator/bin/native-obfuscator"
      - run: bash src/test/modern/verify.sh "$PWD/build/install/native-obfuscator/bin/native-obfuscator"
        env:
          JAVA_RELEASE: ${{ matrix.java }}
      - run: bash src/test/generated/verify.sh "$PWD/build/install/native-obfuscator/bin/native-obfuscator"
        env:
          JAVA_RELEASE: ${{ matrix.java }}
      - name: Verify JNI array, field, and call slices
        run: python3 src/test/native-coverage/verify.py build/install/native-obfuscator
      - name: Verify native build budgets and failed-output preservation
        run: python3 src/test/native-build/verify.py build/install/native-obfuscator/bin/native-obfuscator
      - name: Check benchmark equivalence and budget enforcement
        if: matrix.java == '25'
        run: python3 -B benchmarks/test-comparison.py
      - name: Check Java-to-native performance budgets
        if: matrix.java == '25'
        shell: bash
        run: |
          python3 -B benchmarks/compare.py --output build/performance-results \
            --build-runs 3 --startup-runs 5 --forks 3 --warmups 6 --trials 7 --iterations 2097152 \
            --native-limit minNativeCoveragePercent=85 --native-limit maxBuildMs=6000 \
            --native-limit maxStartupIncreaseMs=750 --native-limit maxStepOverheadNs=12 \
            --native-limit maxPerCallOverheadPercent=700 --native-limit maxBatchOverheadPercent=100 \
            --native-limit maxArtifactGrowthPercent=400
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && matrix.java == '25'
        with:
          name: performance-results
          path: |
            build/performance-results/**/*.json
            build/performance-results/**/*.stdout
            build/performance-results/**/*.stderr
          if-no-files-found: error
          retention-days: 14
      - name: Verify tagged distributions and their SPDX inventory
        if: matrix.java == '25'
        shell: bash
        run: |
          bash scripts/ci-gradle.sh -PreleaseVersion=1.2.3-rc.1 distZip distTar
          python3 src/test/release/verify.py
      - name: Verify deterministic utility generation and archive heuristics
        shell: bash
        run: |
          mkdir -p build/padding-tests
          javac --release 21 -cp 'build/install/native-obfuscator/lib/*' -d build/padding-tests \
            src/test/padding/GeneratorChecks.java src/test/padding/ArchiveCheck.java
          java -Xverify:all -cp 'build/padding-tests:build/install/native-obfuscator/lib/*' dev.nativeobfuscator.GeneratorChecks
          java -cp 'build/padding-tests:build/install/native-obfuscator/lib/*' ArchiveCheck --self-test
      - name: Verify array joins in renamed and adversarial classfiles
        shell: bash
        run: |
          mkdir -p build/array-join-unit
          libs="$PWD/build/install/native-obfuscator/lib/*"
          javac --release 21 -Xlint:all -Werror -cp "$libs" -d build/array-join-unit src/test/modern/ArrayJoinTest.java
          java -Xverify:all -cp "$PWD/build/array-join-unit:$libs" ArrayJoinTest build/array-join-runtime
      - name: Verify analysis configuration, manifest, and archive limits
        shell: bash
        run: |
          mkdir -p build/analysis-unit
          libs='build/install/native-obfuscator/lib/*'
          javac --release 21 -cp "$libs" -d build/analysis-unit \
            src/test/analysis/{AnalysisConfigTest,AnalysisCorpusTest,AnalysisDecoysTest,AnalysisManifestTest,AnalysisNativeTest,ArchiveLimitsTest,NativeBindingTest}.java
          classpath="build/analysis-unit:$libs"
          for test in AnalysisConfigTest AnalysisCorpusTest AnalysisDecoysTest AnalysisNativeTest ArchiveLimitsTest NativeBindingTest; do
            java -Xverify:all -cp "$classpath" "dev.nativeobfuscator.$test"
          done
          java -Xverify:all -cp "$classpath" AnalysisManifestTest
      - name: Verify Kotlin compilation and runtime
        shell: bash
        run: |
          export GRADLE_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v gradle)")")")"
          bash src/test/kotlin/verify.sh "$PWD/build/install/native-obfuscator/bin/native-obfuscator"

  cross-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: '9.3.1'
      - name: Build the CLI distribution
        run: bash scripts/ci-gradle.sh installDist
      - run: tar -czf native-obfuscator-cli.tar.gz -C build/install native-obfuscator
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-obfuscator-cli
          path: native-obfuscator-cli.tar.gz
          if-no-files-found: error
          retention-days: 3
      - name: Locate a supported LLVM disassembler
        shell: bash
        run: |
          if ! command -v llvm-objdump >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y llvm
          fi
          printf 'LLVM_OBJDUMP=%s\n' "$(command -v llvm-objdump)" >> "$GITHUB_ENV"
      - name: Download the pinned Zig release
        shell: bash
        run: |
          zig_archive=zig-x86_64-linux-0.15.2.tar.xz
          zig_sha256=02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
          for url in \
            "https://pkg.hexops.org/zig/$zig_archive?source=github-2q9e-native-obfuscator" \
            "https://zig.linus.dev/zig/$zig_archive?source=github-2q9e-native-obfuscator" \
            "https://ziglang.org/download/0.15.2/$zig_archive"; do
            echo "Downloading $url"
            if curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
              --connect-timeout 10 --max-time 90 --max-filesize 53733924 --output "$zig_archive" "$url" \
              && printf '%s  %s\n' "$zig_sha256" "$zig_archive" | sha256sum --check; then
              tar -xJf "$zig_archive"
              exit 0
            fi
          done
          echo "::error::Could not download the checksum-pinned Zig archive"
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zig-linux-x86_64
          path: zig-x86_64-linux-0.15.2.tar.xz
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Cross-compile the arithmetic fixture
        shell: bash
        run: |
          mkdir -p fixture/classes
          javac --release 25 -d fixture/classes src/test/fixtures/Arithmetic.java
          jar --create --file fixture/original.jar --main-class Arithmetic -C fixture/classes .
          build/install/native-obfuscator/bin/native-obfuscator protect \
            --input fixture/original.jar --output fixture/protected.jar --include 'Arithmetic#calc*' \
            --unsupported retain --target all --zig "$PWD/zig-x86_64-linux-0.15.2/zig"
      - name: Verify and package the analysis profiles for the runtime matrix
        shell: bash
        run: |
          zig="$PWD/zig-x86_64-linux-0.15.2/zig"
          python3 src/test/analysis/verify.py --zig "$zig"
          python3 src/test/analysis/verify-concurrent.py --zig "$zig"
          python3 src/test/analysis/verify-targets.py --zig "$zig"
          for profile in balanced maximum; do
            common=(--input fixture/original.jar --include 'Arithmetic#calc*' --unsupported retain
              --target all --analysis-resistance "$profile" --analysis-seed 42 --padding off)
            build/install/native-obfuscator/bin/native-obfuscator harden "${common[@]}" \
              --output "fixture/$profile.jar" --zig "$zig"
          done
      - name: Cross-build and validate the JNI coverage fixture
        shell: bash
        run: |
          python3 src/test/native-coverage/verify.py build/install/native-obfuscator \
            --work fixture/native-coverage --target all --zig "$PWD/zig-x86_64-linux-0.15.2/zig"
      - name: Cross-build and validate the Kotlin fixture
        shell: bash
        run: |
          export GRADLE_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v gradle)")")")"
          export KOTLIN_FIXTURE_DIR="$PWD/fixture/kotlin"
          bash src/test/kotlin/verify.sh "$PWD/build/install/native-obfuscator/bin/native-obfuscator" \
            --target all --zig "$PWD/zig-x86_64-linux-0.15.2/zig"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cross-built-fixture
          path: |
            fixture/*.jar
            fixture/native-coverage/original.jar
            fixture/native-coverage/protected.jar
            fixture/native-coverage/hierarchy-protected.jar
            fixture/native-coverage/hierarchy-library.jar
            fixture/kotlin/*.jar
          if-no-files-found: error
          retention-days: 3

  runtime:
    needs: [cross-build, llvm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
            distribution: zulu
    steps:
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: ${{ matrix.distribution || 'temurin' }}
          java-version: '25'
          architecture: ${{ matrix.arch }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cross-built-fixture
          path: fixture
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: llvm-differential-fixture-*
          merge-multiple: true
          path: fixture
      - name: Run protected code on the target
        shell: bash
        run: |
          java -Xverify:all -jar fixture/original.jar > original.txt
          for artifact in protected balanced maximum llvm-22-maximum llvm-23-maximum; do
            java -Xverify:all -Xcheck:jni --enable-native-access=ALL-UNNAMED \
              -jar "fixture/$artifact.jar" > "$artifact.txt" 2> "$artifact.log" || {
                cat "$artifact.log" >&2
                exit 1
              }
            cmp original.txt "$artifact.txt"
            if grep -F 'WARNING in native method' "$artifact.log"; then
              exit 1
            fi
          done
      - name: Run JNI coverage on the target
        shell: bash
        run: |
          cd fixture/native-coverage
          java -Xverify:all -jar original.jar > original.txt
          for artifact in protected hierarchy-protected; do
            java -Xverify:all -Xcheck:jni --enable-native-access=ALL-UNNAMED \
              -jar "$artifact.jar" > "$artifact.txt" 2> "$artifact.log" || {
                cat "$artifact.log" >&2
                exit 1
              }
            cmp original.txt "$artifact.txt"
            if grep -F 'WARNING in native method' "$artifact.log"; then
              exit 1
            fi
          done
      - name: Run the Kotlin fixture on the target
        shell: bash
        run: |
          cd fixture/kotlin
          separator=:
          if [[ "$RUNNER_OS" == Windows ]]; then
            separator=';'
          fi
          libraries="kotlin-stdlib.jar${separator}kotlin-reflect.jar"
          main=fixture.kotlin.KotlinFixtureKt
          java -Xverify:all -cp "original.jar${separator}$libraries" "$main" original > original.txt
          java -Xverify:all -Xcheck:jni --enable-native-access=ALL-UNNAMED \
            -cp "protected.jar${separator}$libraries" "$main" protected > protected.txt 2> protected.log || {
              cat protected.log >&2
              exit 1
            }
          cmp original.txt protected.txt
          if grep -F 'WARNING in native method' protected.log; then
            exit 1
          fi
      - if: runner.os == 'Windows'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-obfuscator-cli
      - name: Check the installed Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          tar.exe -xzf native-obfuscator-cli.tar.gz
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\native-obfuscator\bin\native-obfuscator.bat --help
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: runtime-results-${{ matrix.runner }}
          path: |
            *.txt
            *.log
            fixture/native-coverage/*.txt
            fixture/native-coverage/*.log
            fixture/kotlin/*.txt
            fixture/kotlin/*.log
          if-no-files-found: error
          retention-days: 14

  required-checks:
    name: Require all verification jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    if: always()
    needs: [cross-build, differential, llvm, runtime]
    steps:
      - name: Fail when any verification job failed, was cancelled, or was skipped
        env:
          JOBS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          jobs = json.loads(os.environ["JOBS"])
          failures = [f"{name}: {job['result']}" for name, job in jobs.items() if job["result"] != "success"]
          if failures:
              sys.exit("Verification did not pass\n" + "\n".join(failures))
          PY
