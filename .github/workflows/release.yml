name: Release Native Obfuscator

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish immediately instead of creating a draft
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  validate:
    name: Validate the release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require an existing Semantic Versioning tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag
          version=$(python3 scripts/release_assets.py version "$RELEASE_TAG")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  verify:
    needs: validate
    uses: ./.github/workflows/verify.yml

  package:
    needs: [validate, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: write
      id-token: write
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: '9.3.1'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: llvm-plugin-linux-*
          path: release-assets
          merge-multiple: true
      - name: Package the tagged CLI
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          gradle --no-daemon --console=plain "-PreleaseVersion=$RELEASE_VERSION" installDist distZip distTar
          test "$(build/install/native-obfuscator/bin/native-obfuscator --version)" = "native-obfuscator $RELEASE_VERSION"
          for arch in x86_64 aarch64; do
            for major in 22 23; do
              compgen -G "release-assets/native-encode-linux-$arch-llvm-$major.*.tar.gz" > /dev/null
            done
          done
          java -version 2> release-assets/BUILD-TOOLS.txt
          gradle --version >> release-assets/BUILD-TOOLS.txt
          python3 --version >> release-assets/BUILD-TOOLS.txt
          python3 scripts/release_assets.py package --tag "$RELEASE_TAG" \
            --epoch "$(git show -s --format=%ct HEAD)" --repository "$GITHUB_REPOSITORY" \
            --zip build/distributions/native-obfuscator.zip --tar build/distributions/native-obfuscator.tar \
            --metadata gradle/verification-metadata.xml --output release-assets
          cp CHANGELOG.md release-assets/
          (
            cd release-assets
            sha256sum native-encode-*.tar.gz "native-obfuscator-$RELEASE_TAG."{zip,tar.gz,spdx.json} \
              CHANGELOG.md BUILD-TOOLS.txt > SHA256SUMS
          )
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/native-obfuscator-${{ github.ref_name }}.zip
            release-assets/native-obfuscator-${{ github.ref_name }}.tar.gz
          sbom-path: release-assets/native-obfuscator-${{ github.ref_name }}.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: attested-release-assets
          path: release-assets/
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: attested-release-assets
          path: release-assets
      - name: Verify and create the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.package.outputs.commit }}
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish }}
        shell: bash
        run: |
          (cd release-assets && sha256sum --check SHA256SUMS)
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_COMMIT"
          for asset in release-assets/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$RELEASE_COMMIT"
          done
          for asset in "release-assets/native-obfuscator-$RELEASE_TAG."{zip,tar.gz}; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$RELEASE_COMMIT" \
              --predicate-type https://spdx.dev/Document/v2.3
          done
          options=()
          [[ "${RELEASE_TAG%%+*}" != *-* ]] || options+=(--prerelease)
          [[ "$PUBLISH_RELEASE" == true ]] || options+=(--draft)
          gh release create --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            "${options[@]}" "$RELEASE_TAG" release-assets/*
