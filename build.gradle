plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.ow2.asm:asm:9.9'
    implementation 'org.ow2.asm:asm-tree:9.9'
    implementation 'org.ow2.asm:asm-analysis:9.9'
    implementation 'org.ow2.asm:asm-commons:9.9'
    implementation 'com.google.code.gson:gson:2.13.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = 'dev.nativeobfuscator.Main'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar') {
    manifest {
        attributes('Implementation-Version': providers.gradleProperty('releaseVersion').orElse('0.0.0-dev').get())
    }
}

tasks.named('startScripts') {
    def unixLauncher = layout.projectDirectory.file('src/launchers/native-obfuscator').asFile
    def windowsLauncher = layout.projectDirectory.file('src/launchers/native-obfuscator.bat').asFile

    inputs.files(unixLauncher, windowsLauncher).withPathSensitivity(PathSensitivity.RELATIVE)
    unixStartScriptGenerator = { details, output ->
        output.write(unixLauncher.getText('UTF-8'))
    } as org.gradle.jvm.application.scripts.ScriptGenerator
    windowsStartScriptGenerator = { details, output ->
        output.write(windowsLauncher.getText('UTF-8').replace('\r\n', '\n').replace('\n', '\r\n'))
    } as org.gradle.jvm.application.scripts.ScriptGenerator
}

distributions {
    main {
        contents {
            from('LICENSE')
            into('licenses') {
                from('licenses')
            }
        }
    }
}
